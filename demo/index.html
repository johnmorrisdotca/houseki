<!doctype html>
<html lang="en">
<head>
  <!--family:head-->
  <link rel="stylesheet" href="family.css">
  <link rel="stylesheet" href="houseki.css">
</head>
<body>
<main>
  <!--family:header-->
  <!--family:pages-->
  <div class="layout">
    <aside>
      <h2 data-i="settings">Settings</h2>
      <label class="field" data-help-en="Relaxed has no clock, so you can plan each move. Arcade drops pieces on a timer. Daily is today's board, the same for everyone." data-help-ja="リラックスは時間制限がなく、じっくり考えられます。アーケードは一定の間隔で石が落ちます。デイリーは今日の盤面で、全員が同じです。"><span data-i="mode">Mode</span><select id="mode"><option value="relaxed">Relaxed</option><option value="arcade">Arcade</option><option value="daily">Daily</option></select></label>
      <label class="field" data-help-en="Short guided lessons, one idea at a time. Choose one, then press New game." data-help-ja="ひとつずつ学べる短いレッスンです。選んで「新しいゲーム」を押します。"><span data-i="lessonLabel">Learn to play</span><select id="lesson"></select></label><label class="field" data-help-en="Graded challenges from easy to hard, each with a goal. Free play has no goal. Press New game to start." data-help-ja="やさしい順に並んだ、目標つきのチャレンジです。自由に遊ぶには目標がありません。「新しいゲーム」で始めます。"><span data-i="challengeLabel">Challenge level</span><select id="level"></select></label>
      <label class="field" data-help-en="The size of the board. Bonus sizes are larger and scroll inside the play area." data-help-ja="盤面の大きさです。ボーナスの大きさは広く、遊ぶ場所の中でスクロールします。"><span data-i="board">Board</span><select id="preset"><option value="compact">Compact · 5 × 13</option><option value="standard" selected>Standard · 8 × 13</option><option value="narrow">Narrow · 6 × 13</option><option value="wide">Wide · 10 × 13</option><option value="extraWide">Extra wide · 12 × 13</option><option value="tall">Tall · 8 × 17</option><option value="deep">Deep · bonus</option><option value="large">Large · bonus</option></select></label>
      <label class="field" data-help-en="How many gem colours are in play. Fewer colours make matches easier." data-help-ja="使う宝石の色数です。色が少ないほど、そろえやすくなります。"><span data-i="colours">Colours</span><select id="colours"><option value="4">Four</option><option value="5" selected>Five</option><option value="6">Six</option></select></label>
      <div class="fam-actions"><button class="fam-button" id="new" data-accent="true" data-i="new">New game</button><button class="fam-button" id="restart" data-i="restart">Restart</button></div>
      <p data-i="help">Cycle the colours, line up three, and watch the gems fall into new matches. Lines may run horizontally, vertically, or diagonally.</p>
      <p id="pending" class="micro" hidden>Settings changed. Select New game to apply.</p>
      <p class="micro" data-i="keys">Keyboard: ← → move · Z / X cycle · Space place</p>
      <label class="field" data-help-en="The look of the board's surface. It changes nothing in the rules." data-help-ja="盤面の素材の見た目です。ルールは変わりません。"><span data-i="material">Board material</span><select id="material"><option value="ivory">Ivory</option><option value="slate">Slate</option><option value="wood">Wood</option></select></label>
      <div class="checks" data-help-en="Animation, reduced motion and sound are kept on this device." data-help-ja="アニメーション、動きの軽減、効果音の設定は、この端末に保存されます。">
      <label class="check"><input type="checkbox" id="animations" checked><span data-i="animations">Animation</span></label>
      <label class="check"><input id="motion" type="checkbox"><span data-i="reduced">Reduce motion</span></label>
      <label class="check"><input id="sound" type="checkbox"><span data-i="sound">Sound effects</span></label>
      </div>
    </aside>
    <section class="fam-felt game-screen" tabindex="0" aria-label="Falling Triplets game">
      <div class="panel-head"><h2 data-i="title">Falling Triplets</h2><div class="stats"><span><b data-i="score">Score</b> <output id="score">0</output></span><span><b data-i="chain">Best chain</b> <output id="chain">0</output></span></div></div>
      <div class="play-area">
        <section id="objective" hidden><p id="lesson-guide" hidden></p><p id="goal-text"></p><progress id="goal-progress" max="1" value="0"></progress><p id="budget"></p></section><div class="well-scroll"><div class="well-wrap"><div id="well" class="well" role="img" aria-label="Gem board"></div><div class="loss-line"></div></div></div><div class="board-nav" hidden><button class="fam-button" data-scroll="top">Top</button><button class="fam-button" data-scroll="bottom">Bottom</button><output class="scroll-position"></output></div>
        <section class="next-wrap"><h3 data-i="next">Next</h3><div id="next" class="next"></div><p id="status" aria-live="polite">Place the triplet</p></section>
      </div>
      <div class="controls">
        <button data-action="left" class="fam-button" aria-label="Left">←</button>
        <button data-action="cycle-backward" class="fam-button" data-i="reverse">Reverse cycle</button>
        <button data-action="cycle-forward" class="fam-button" data-i="cycle">Cycle</button>
        <button data-action="right" class="fam-button" aria-label="Right">→</button>
        <button data-action="soft-drop" class="fam-button soft">Down</button>
        <button data-action="hard-drop" class="fam-button drop">Drop</button>
        <button data-action="place" class="fam-button place" data-accent="true">Place</button>
        <button data-action="pause" class="fam-button pause">Pause</button>
        <button data-action="resume" class="fam-button resume" hidden>Continue</button>
      </div>
    </section>
  </div>
  <!--family:unreviewed-->
  <!--family:footer-->
</main>
<!--family:scripts demo.js-->
</body>
</html>
